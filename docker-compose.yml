services:
  frontend:
    build:
      context: ./frontend
    container_name: heritage_frontend
    depends_on:
      - api_gateway
    ports:
      - "3000:80"
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: heritage_api_gateway
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      AI_SERVICE_URL: http://ai_service:8001
    depends_on:
      - ai_service
    expose:
      - "8000"
    restart: unless-stopped

  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: heritage_ai_service
    command: uvicorn services.ai_service.main:app --host 0.0.0.0 --port 8001
    environment:
      OSRM_BASE_URL: http://osrm:5000
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - osrm
    expose:
      - "8001"
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: heritage_osrm
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    volumes:
      - ./data/osrm:/data:ro
    expose:
      - "5000"
    restart: unless-stopped
